<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Login – HelpingHands</title><link href="css/style.css" rel="stylesheet"></head>
<body data-base="" class="auth-bg"><main class="auth-card">
<a href="index.html" class="brand mb-4 d-inline-flex"><i class="bi bi-hand-thumbs-up-fill"></i> HelpingHands</a>
<h1 class="h3 fw-bold">Welcome back</h1><p class="text-muted">Log in to manage activities, requests and donations.</p>

<div id="msg"></div>
<form id="loginForm" novalidate>
<div class="mb-3"><label class="form-label">Email</label><input type="email" id="email" class="form-control" required><div class="invalid-feedback">Enter a valid email address.</div></div>
<div class="mb-3"><label class="form-label">Password</label><div class="input-group"><input type="password" id="password" class="form-control" minlength="6" required><button type="button" class="btn btn-outline-secondary toggle-pw" aria-label="Show password"><i class="bi bi-eye"></i></button><div class="invalid-feedback">Password needs at least 6 characters.</div></div></div>

<div class="d-flex justify-content-between mb-3"><div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div><a href="#" data-bs-toggle="modal" data-bs-target="#forgot">Forgot password?</a></div>
<button class="btn btn-hh w-100">Log in</button></form>
<p class="text-center mt-3 mb-0">New here? <a href="register.html">Create an account</a></p></main>
<div class="modal fade" id="forgot"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-3"><h5 class="fw-bold">Reset your password</h5><p class="text-muted small">UI only for now. Flask will send the reset email later.</p><input type="email" class="form-control mb-3" placeholder="you@example.com"><button class="btn btn-hh" data-bs-dismiss="modal" onclick="toast('Reset link sent (demo)')">Send reset link</button></div></div></div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
